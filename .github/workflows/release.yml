name: Desktop builds and releases

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
            certificate: WIN_CSC_LINK
            certificate_password: WIN_CSC_KEY_PASSWORD
          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
            certificate: MAC_CSC_LINK
            certificate_password: MAC_CSC_KEY_PASSWORD
          - name: macOS Intel
            os: macos-15
            platform: mac
            arch: x64
            certificate: MAC_CSC_LINK
            certificate_password: MAC_CSC_KEY_PASSWORD
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release.cjs
      - name: Run tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Package installers
        run: npm run package:built -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ secrets[matrix.certificate] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.certificate_password] }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: midi-deck-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: midi-deck-*
          path: release-assets
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          node scripts/checksums.cjs release-assets
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            notes=()
            if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
              notes=(--notes-file "docs/releases/$RELEASE_TAG.md")
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "MIDI Deck $RELEASE_TAG" "${notes[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
